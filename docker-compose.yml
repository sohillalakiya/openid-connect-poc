services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: idb-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-patra_user}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-SecurePostgres2024!}
    command:
      - 'postgres'
      - '-c'
      - 'max_connections=200'
      - '-c'
      - 'shared_buffers=256MB'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - launcher-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_SUPERUSER:-patra_user}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  launcher-network:
    driver: bridge
